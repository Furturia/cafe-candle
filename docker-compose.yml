services:
  mysql:
    image: mysql:8.0
    container_name: candle-cafe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: candle_cafe_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - candle-cafe-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: candle-cafe-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: candle_cafe_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      FRONTEND_URL: http://localhost:5173
      MAX_FILE_SIZE: 5242880
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - candle-cafe-network

  frontend:
    build:
      context: ./frontend
    container_name: candle-cafe-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - candle-cafe-network

networks:
  candle-cafe-network:
    driver: bridge

volumes:
  mysql_data:
